[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-clusters"
version = "0.1.0"
description = "Split text into emoji-aware clusters (ZWJ, flag, tag, keycap, modifier sequences) without a bundled emoji property table."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "nking92" }]

[project.urls]
Homepage = "https://github.com/nking92/emoji-clusters"

[tool.setuptools.packages.find]
include = ["emoji_clusters*"]
